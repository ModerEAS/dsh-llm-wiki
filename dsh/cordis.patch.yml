# LLM Wiki — DSH bundle patch (Loader YAML dialect).
#
# Install with plugin_manager `install_bundle` pointing at the `dsh/`
# directory AFTER `pnpm build:dsh` (the Host entry re-exports ../dist).
# Do not hand-edit the profile's package.json / cordis.patch.yml.
- insert:
    - id: llm-wiki
      name: 'dsh-llm-wiki'
      # Empty on purpose: Settings → LLM Wiki writes a key here only when the
      # user saves it, and the plugin gives those explicit row values
      # precedence over `llm-wiki` settings files. Seeding defaults here would
      # mask a project's `.dsh/settings.json` for no gain.
      config: {}
    # Synthesis child preset (T6.3/H13): persona-only, outputSchema/JSON
    # handoff. Appears in Settings → Agent presets as "LLM Wiki synthesis".
    # Never sets registry `default` (stays Standard / user choice) and never
    # touches the main Standard preset (H13: no commit tools in main mode).
    - id: preset-llm-wiki-synthesis
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: llm-wiki-synthesis
        order: 5
        name: LLM Wiki synthesis
        description: Synthesis-only child for wiki ingest (outputSchema / JSON handoff).
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You synthesize wiki pages. Reply with structured JSON only when asked.
                Do not call commit tools unless they are in your tool list.
              complete: true
